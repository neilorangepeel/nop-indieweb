<!--
	Checkin — single post.

	Variant 6 from the proportion study: two thirds map, one third record, and
	the map at its own 4:3 rather than filling the viewport.

	That last part is the whole of it. Five ratios were measured for the empty
	space under the record, and every ratio that narrowed the record column made
	the hole BIGGER — the record is six rows and does not grow, so narrowing its
	column only makes the leftover taller. Two thirds measured 122px worse than
	55/45. Dropping the full-height constraint took the same two-thirds layout
	from 571px of void to 40px.

	align:full with spacing|30 is exactly what parts/header.html carries, so the
	map's left edge lands on the logo's left edge. Not eyeballed to match — the
	same value.

	The map is duotoned into the press through the block's own filter.duotone
	support. The contrast stretch the mock used in front of it (brightness .48,
	contrast 2.8) is deliberately NOT here: theme.json has no filter property
	beyond duotone and this file carries no CSS. Without it the map reads pale.
	The fix belongs at the source — the cached PNGs are generated through a
	Geoapify styleCustomization already filterable via
	nop_indieweb_map_style_customization, so the contrast can be baked into the
	image rather than layered over it.

	Still absent, and deliberately: post-footer / replies / comment-form, so
	there is no way to respond and no webmentions display.
-->
