<!-- wp:group {"metadata":{"name":"Main"},"style":{"spacing":{"padding":{"top":"var:preset|spacing|50","bottom":"var:preset|spacing|50"}}},"layout":{"type":"constrained"}} -->

	<!--
		The card is flow, not constrained. A constrained container clamps every
		unaligned child to contentSize, so an alignwide card would still have
		rendered its contents in a 720px ribbon down the middle of a 1200px
		border. Each row inside carries its own padding instead.
	-->
	<!-- wp:group {"metadata":{"name":"Checkin"},"align":"wide","style":{"border":{"style":"solid","width":"1px"},"spacing":{"blockGap":"0"}},"layout":{"type":"default"}} -->

			<!-- wp:group {"style":{"typography":{"fontWeight":"700","textTransform":"uppercase","letterSpacing":"2px"},"spacing":{"blockGap":"6px"}},"fontSize":"small","layout":{"type":"flex","flexWrap":"nowrap","justifyContent":"space-between"}} -->

				<!-- wp:group {"style":{"spacing":{"blockGap":"0.5em"}},"layout":{"type":"flex","flexWrap":"wrap"}} -->

				</div>
				<!-- /wp:group -->

				<!-- wp:group {"layout":{"type":"constrained","justifyContent":"right"}} -->
				<div class="wp-block-group">
					<!-- wp:post-date {"textAlign":"left","format":"G:i · d.m.Y","style":{"layout":{"selfStretch":"fill"}}} /-->
				</div>
				<!-- /wp:group -->

			</div>
			<!-- /wp:group -->

		</div>
		<!-- /wp:group -->

		<!-- wp:separator {"align":"full","className":"is-style-default","style":{"spacing":{"margin":{"top":"0","bottom":"0"}}}} -->
		<hr class="wp-block-separator alignfull has-alpha-channel-opacity is-style-default" style="margin-top:0;margin-bottom:0"/>
		<!-- /wp:separator -->

		<!--
			Flow layout, not constrained. A constrained group re-clamps every
			unaligned child to contentSize, which put the columns back to 720px
			inside a card that is 1200px wide and left the map at 356px.
		-->
		<!-- wp:group {"style":{"spacing":{"padding":{"top":"var:preset|spacing|40","bottom":"var:preset|spacing|40","left":"var:preset|spacing|30","right":"var:preset|spacing|30"}}},"layout":{"type":"default"}} -->
		<div class="wp-block-group" style="padding-top:var(--wp--preset--spacing--40);padding-right:var(--wp--preset--spacing--30);padding-bottom:var(--wp--preset--spacing--40);padding-left:var(--wp--preset--spacing--30)">

			<!--
				Map left, data right. The map and the data are the half of a checkin
				that is always present — venue, coordinates and weather sit at 100%
				coverage and the map at 99% — so they carry the page on their own.
				Everything that only sometimes appears hangs below the map, where its
				absence closes up instead of leaving a hole. 71% of checkins have no
				content at all and simply end after these two columns.

				Columns stack below 782px on their own; no breakpoint of ours.
			-->
			<!-- wp:columns {"verticalAlignment":"top","style":{"spacing":{"blockGap":{"top":"var:preset|spacing|40","left":"var:preset|spacing|50"}}}} -->
			<div class="wp-block-columns are-vertically-aligned-top">

				<!-- wp:column {"verticalAlignment":"top","width":"55%","style":{"spacing":{"blockGap":"var:preset|spacing|30"}}} -->

					<!-- wp:nop-indieweb/checkin-map /-->

					<!--
						The note and the photographs both live in post_content and are
						rendered here, directly under the map. In every one of the 194
						checkins carrying both, the note is authored first and the
						photograph second, so this reads map → note → photographs
						without any reordering. A single photograph fills the column; a
						gallery tiles into thumbnails beneath it.
					-->
					<!-- wp:post-content {"layout":{"type":"default"}} /-->

				</div>
				<!-- /wp:column -->

				<!-- wp:column {"verticalAlignment":"top","width":"45%","style":{"spacing":{"blockGap":"var:preset|spacing|30"}}} -->

					<!-- wp:group {"style":{"spacing":{"blockGap":"6px"}},"fontSize":"small","layout":{"type":"flex","flexWrap":"wrap","verticalAlignment":"center"}} -->
					<div class="wp-block-group has-small-font-size">
						<!-- wp:group {"style":{"spacing":{"padding":{"top":"0.3em"}}},"layout":{"type":"constrained"}} -->
						<div class="wp-block-group" style="padding-top:0.3em">

						<!-- wp:paragraph {"textColor":"muted"} -->
						<p class="has-muted-color has-text-color">·</p>
						<!-- /wp:paragraph -->

						<!-- wp:paragraph {"metadata":{"bindings":{"content":{"source":"nop-indieweb/post-meta","args":{"key":"nop_indieweb_weather_summary"}}}}} -->
						<p>Light Rain</p>
						<!-- /wp:paragraph -->
					</div>
					<!-- /wp:group -->

					<!--
						The visit number is the one figure here that only exists because
						the archive is nineteen years deep — Ormeau Park is on its 203rd
						— so it is set apart rather than filed in with the rest.
					-->
					<!-- wp:paragraph {"metadata":{"bindings":{"content":{"source":"nop-indieweb/post-meta","args":{"field":"venue_visit_number"}}}},"className":"nop-visit","style":{"typography":{"fontWeight":"800"}},"fontSize":"large"} -->
					<p class="nop-visit has-large-font-size" style="font-weight:800">203rd Visit</p>
					<!-- /wp:paragraph -->

					<!--
						Flights are 20 posts out of 1,631. Both bindings resolve to null
						when the meta is absent, and the plugin's :has() rules close the
						empty group up, so this costs the other 1,611 nothing.
					-->
					<!-- wp:group {"className":"nop-flight","style":{"spacing":{"blockGap":"4px"}},"layout":{"type":"constrained"}} -->
					<div class="wp-block-group nop-flight">
						<!-- wp:paragraph {"metadata":{"bindings":{"content":{"source":"nop-indieweb/post-meta","args":{"field":"flight_route"}}}},"className":"nop-flight__route","style":{"typography":{"fontWeight":"700","textTransform":"uppercase","letterSpacing":"1px"}},"fontSize":"small"} -->

						<!-- /wp:paragraph -->

						<!-- wp:paragraph {"metadata":{"bindings":{"content":{"source":"nop-indieweb/post-meta","args":{"field":"flight_distance"}}}},"className":"nop-flight__distance","textColor":"muted","fontSize":"small"} -->

					<!-- /wp:paragraph -->

				</div>
				<!-- /wp:column -->

			</div>
			<!-- /wp:columns -->

		<!-- wp:separator {"align":"full","className":"is-style-default","style":{"spacing":{"margin":{"top":"0","bottom":"0"}}}} -->

</div>
