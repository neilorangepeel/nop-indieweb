<!--
	Checkin — single post.

	Two thirds map, one third record, and the map at its own aspect rather than
	filling the viewport. Five ratios were measured for the empty space under the
	record, and every ratio that narrowed the record column made the hole BIGGER —
	the record is a fixed number of rows and does not grow, so narrowing its
	column only makes the leftover taller. Dropping the full-height constraint
	took the same two-thirds layout from 571px of void to 40px.

	spacing|30 is the ONLY spacing value in this section: all four sides of the
	padding and the gutter between the columns. One measure, so the map sits on a
	mounted plate rather than in a box whose edges each disagree. It is also
	exactly what parts/header.html carries, so the map's left edge lands on the
	logo's left edge — not eyeballed to match, the same value. Change all five or
	none.

	The map is duotoned into the press through the block's own filter.duotone
	support. The contrast stretch the mock used in front of it (brightness .48,
	contrast 2.8) is deliberately NOT here: theme.json has no filter property
	beyond duotone and this file carries no CSS. Without it the map reads pale.
	The fix belongs at the source — the cached PNGs are generated through a
	Geoapify styleCustomization already filterable via
	nop_indieweb_map_style_customization, so the contrast can be baked into the
	image rather than layered over it. The same regeneration should give them a
	3:2 aspect, which removes the crop-or-stretch choice entirely.

	post-content is absent: it was removed in the editor while the composition was
	being settled, and where the note goes has not been decided.

	Still absent, and deliberately: post-footer / replies / comment-form, so there
	is no way to respond and no webmentions display.

	NOTE: this template has a database copy (wp_template post, slug
	single-nop_kind-checkin) which OVERRIDES this file. Editing this file alone
	changes nothing on the front end until that copy is cleared or updated.
-->
