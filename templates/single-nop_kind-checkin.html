<!--
	Checkin — single post.

	Simplified in the Site Editor and ported back here, so this file is the
	source of truth again. Kept in the editor's own compact formatting on
	purpose: the next round-trip through the Site Editor then produces a clean
	diff instead of a whitespace one.

	The shape: map on the left at 55%, the record on the right at 45%. Those are
	the half of a checkin that is always there — venue, coordinates and weather
	sit at 100% coverage and the map at 99% — so they carry the page alone, and
	71% of checkins have nothing else. No border, no separators: the whitespace
	does that work.

	Still open, and deliberately absent rather than forgotten:
	  · the date, which left with the eyebrow bar — a checkin is a place at a
	    time, and right now the page says only the place
	  · kind and venue category, likewise
	  · post-content, so the note or photograph on 478 checkins shows on none
	  · post-footer / replies / comment-form, so there is no way to respond and
	    no webmentions display
-->
