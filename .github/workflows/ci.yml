name: CI

# Quality gate for the PHP side of the plugin. Runs on every push and PR.
# Deployment is handled separately by deploy.yml (push to main only); this
# workflow never deploys — it only lints, type-checks, and tests.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Catches parse/syntax errors across the whole plugin (vendor excluded).
      - name: php -l every source file
        run: |
          find . -type f -name '*.php' \
            -not -path './vendor/*' -not -path './node_modules/*' \
            -print0 | xargs -0 -n1 -P4 php -l

  templates:
    name: Block markup
    runs-on: ubuntu-latest
    # Blocking: an unclosed tag in a block template renders as "Block contains
    # unexpected or invalid content" on every post the template serves, and the
    # editor's fix is to rewrite your file. Cheap to catch here, expensive to
    # find in the Site Editor.
    steps:
      - uses: actions/checkout@v4
      - name: Validate block templates
        run: python3 bin/check-block-markup.py templates

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run unit tests
        run: composer test

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    # Blocking: pre-existing findings are absorbed by phpstan-baseline.neon, so
    # this fails only on NEW type errors. Regenerate the baseline after fixing
    # entries via the phpstan-baseline workflow (or `composer phpstan:baseline`).
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Static analysis
        run: composer phpstan

  build:
    name: Build artifacts match src
    runs-on: ubuntu-latest
    # Blocking: build/ is committed and production deploys by `git pull` with no
    # npm step, so a src/ edit without `npm run build` would ship stale JS with
    # nothing to catch it. Rebuild and fail if the committed output differs.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # .nvmrc is the single owner of the Node version — webpack output is
          # byte-reproducible only when CI and local build on the same major.
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild
        run: npm run build
      - name: Committed build/ is up to date
        run: |
          if ! git diff --quiet -- build/; then
            echo "::error::build/ is stale — run 'npm run build' and commit the result."
            git diff --stat -- build/
            exit 1
          fi

      # The version lives in three places and NOP_INDIEWEB_VERSION is the one
      # that matters at runtime: it cache-busts every admin/*.js the editor
      # loads. Left behind, the browser keeps serving yesterday's panel and the
      # deploy looks like it did nothing. Drift has bitten twice, so it's a gate.
      - name: Version is the same in all three places
        run: |
          header=$(sed -n 's/^ \* Version: *//p' nop-indieweb.php | head -1 | tr -d ' ')
          constant=$(sed -n "s/^define( 'NOP_INDIEWEB_VERSION', '\(.*\)' );/\1/p" nop-indieweb.php | head -1)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | head -1 | tr -d ' ')
          echo "plugin header: $header / NOP_INDIEWEB_VERSION: $constant / readme Stable tag: $stable"
          if [ "$header" != "$constant" ] || [ "$header" != "$stable" ]; then
            echo "::error::Version mismatch — the plugin header, NOP_INDIEWEB_VERSION and readme.txt Stable tag must all match."
            exit 1
          fi
